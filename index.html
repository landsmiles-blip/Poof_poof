<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff6e8">
<meta name="description" content="Poof Poof — drag falling fruit, merge matching pairs, chase the watermelon.">
<title>Poof Poof</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div id="app">
  <canvas id="game-canvas" hidden></canvas>
  <div id="overlay"></div>
</div>
<!-- 9.3: the in-run pause panel. Deliberately NOT inside #app or reusing
     #overlay -- #overlay is mutually exclusive with the canvas by design
     (js/shop.js's own comment), but this has to sit on top of the canvas
     WHILE it is still showing (frozen) behind it. A fixed, full-viewport
     scrim, shown/hidden by js/main.js, filled by js/shop.js's
     renderPausePanel. -->
<div id="pause-overlay" hidden></div>
<!-- YouTube Playables SDK -- must load before js/main.js, since js/platform.js
     reads window.ytgame.IN_PLAYABLES_ENV at import time to choose an
     implementation. Deliberately left uninserted here rather than guessed:
     an invented <script src> would be indistinguishable from a verified one
     to a future reader. Outside the container this is meant to be a harmless
     404 or an unused global once the real tag is in place -- confirm the
     Pages build still boots with it present before phase 2 is considered
     finished. See docs/playables-plan.md phase 2.3. -->
<script type="module" src="js/main.js"></script>
<script>
  // Service worker update handshake.
  //
  // The worker calls skipWaiting()/clients.claim(), which fires controllerchange
  // here. Without this listener that signal was thrown away and the new build
  // only appeared on the NEXT visit -- the reason shipped features went unseen.
  //
  // Two guards matter. We only reload if a controller already existed at load
  // time, so a first-ever install (which also fires controllerchange) does not
  // pointlessly reload someone with nothing stale. And we never reload during a
  // run: losing an in-progress game to an automatic refresh would be its own
  // bug, so the reload is deferred until the player is back on a menu.
  if ('serviceWorker' in navigator) {
    const hadController = Boolean(navigator.serviceWorker.controller);
    let reloading = false;

    const applyUpdate = () => {
      if (reloading) return;
      reloading = true;
      window.location.reload();
    };

    // main.js sets this to true while a run is in progress.
    window.__poofDeferReload = false;
    window.__poofPendingUpdate = false;
    window.__poofApplyPendingUpdate = () => {
      if (window.__poofPendingUpdate) applyUpdate();
    };

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) return; // first install, nothing stale to replace
      if (window.__poofDeferReload) {
        window.__poofPendingUpdate = true; // applied at the next menu
        return;
      }
      applyUpdate();
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((err) => {
        // Previously swallowed entirely, which hid even an all-or-nothing
        // precache failure that leaves the old worker serving forever.
        console.warn('[poofpoof] service worker registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
